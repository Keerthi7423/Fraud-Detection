<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="256" y1="32" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer glowing shield -->
  <path d="M256 32L80 112v150c0 145 152 208 176 218 24-10 176-73 176-218V112L256 32z" fill="url(#shieldGrad)" filter="url(#glow)"/>
  
  <!-- Inner dark shield -->
  <path d="M256 70l135 60v125c0 110-112 160-135 170-23-10-135-60-135-170V130l135-60z" fill="#0F1117"/>
  
  <!-- Neon Checkmark -->
  <path d="M344 200l-120 120-48-48" stroke="#3B82F6" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#innerGlow)"/>
  <path d="M344 200l-120 120-48-48" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>